#   post-upstream-clone: "python3 setup.py sdist --dist-dir ."
# current_version_command: ["python3", "setup.py", "--version"]
# create_tarball_command: ["python3", "setup.py", "sdist", "--dist-dir", "."]
jobs:
- job: copr_build
  trigger: pull_request
  metadata:
    targets:
    - epel-8-x86_64
    - fedora-36-x86_64


- job: tests
  trigger: pull_request
  identifier: test1
  metadata:
    targets:
      epel-8-x86_64:
        distros: [centos-stream-8]

- job: tests
  trigger: pull_request
  identifier: test2
  metadata:
    targets:
      epel-8-x86_64:
        distros: [centos-stream-8]

- job: tests
  trigger: pull_request
  identifier: test3
  metadata:
    targets:
      - fedora-36-x86_64
