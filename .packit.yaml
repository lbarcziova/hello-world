---
# Benchmark configuration for testing label caching performance
packit_instances: ["stg"]
specfile_path: hello.spec
files_to_sync:
  - .packit.yaml
  - hello.spec
upstream_package_name: hello
downstream_package_name: hello

# Common label requirements for benchmarking
_:
  - &require-benchmark
    require:
      label:
        present:
          - label1
        absent:
          - label2

jobs:
- job: copr_build
  trigger: pull_request
  targets:
  - fedora-rawhide


- job: tests
  trigger: pull_request
  require:
    label:
      present:
        - label2
  targets:
  - fedora-rawhide
  identifier: test-02

- job: tests
  trigger: pull_request
  <<: *require-benchmark
  targets:
  - fedora-rawhide
  identifier: test-03

